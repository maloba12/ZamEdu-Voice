name: Deploy to Firebase Hosting

on:
  push:
    branches: [temp-branch]  # Changed from main to temp-branch
  pull_request:
    branches: [temp-branch]  # Changed from main to temp-branch

env:
  FIREBASE_PROJECT_ID: zamedu-voice
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Updated to LTS version
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          
      - name: Verify Deployment
        run: |
          echo "Deployment to Firebase Hosting completed!"
          echo "Your site should be available at: https://${{ env.FIREBASE_PROJECT_ID }}.web.app"
