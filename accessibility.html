<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Settings - ZamEdu Voice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --copper-red: #B87333;
            --victoria-blue: #4A90E2;
            --savanna-green: #7CB342;
            --cloud-white: #FAFAFA;
            --charcoal: #424242;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cloud-white);
            color: var(--charcoal);
        }
        
        .fingerprint-scanner {
            width: 200px;
            height: 200px;
            border: 3px dashed var(--copper-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .fingerprint-scanner.scanning {
            border-color: var(--savanna-green);
            box-shadow: 0 0 20px rgba(124, 179, 66, 0.3);
        }
        
        .fingerprint-scanner i {
            font-size: 64px;
            color: var(--copper-red);
            transition: all 0.3s ease;
        }
        
        .fingerprint-scanner.scanning i {
            color: var(--savanna-green);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .accessibility-option {
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        
        .accessibility-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-copper-red to-sunset-orange text-white p-6">
                <h1 class="text-3xl font-bold">Accessibility Settings</h1>
                <p class="text-white/90 mt-2">Customize your experience based on your needs</p>
            </div>
            
            <!-- Main Content -->
            <div class="p-6">
                <!-- Disability Questionnaire -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold mb-4">Accessibility Preferences</h2>
                    <div class="space-y-4">
                        <div class="accessibility-option p-4 rounded-lg bg-gray-50">
                            <label class="flex items-center space-x-3">
                                <input type="checkbox" id="visual-impairment" class="rounded text-copper-red">
                                <span class="text-gray-700">I have a visual impairment</span>
                            </label>
                        </div>
                        
                        <div class="accessibility-option p-4 rounded-lg bg-gray-50">
                            <label class="flex items-center space-x-3">
                                <input type="checkbox" id="hearing-impairment" class="rounded text-copper-red">
                                <span class="text-gray-700">I have a hearing impairment</span>
                            </label>
                        </div>
                        
                        <div class="accessibility-option p-4 rounded-lg bg-gray-50">
                            <label class="flex items-center space-x-3">
                                <input type="checkbox" id="mobility-impairment" class="rounded text-copper-red">
                                <span class="text-gray-700">I have a mobility impairment</span>
                            </label>
                        </div>
                        
                        <div class="accessibility-option p-4 rounded-lg bg-gray-50">
                            <label class="flex items-center space-x-3">
                                <input type="checkbox" id="learning-disability" class="rounded text-copper-red">
                                <span class="text-gray-700">I have a learning disability</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- Fingerprint Scanner -->
                <div class="mb-8 text-center">
                    <h2 class="text-xl font-semibold mb-4">Fingerprint Registration</h2>
                    <p class="text-gray-600 mb-6">Register your fingerprint for quick accessibility access</p>
                    
                    <div class="flex justify-center">
                        <div class="fingerprint-scanner" id="fingerprintScanner">
                            <i class="fas fa-fingerprint"></i>
                        </div>
                    </div>
                    
                    <p id="scanStatus" class="mt-4 text-gray-600">Place your finger on the scanner</p>
                </div>
                
                <!-- Language Selection -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold mb-4">Language Preferences</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="accessibility-option p-4 rounded-lg">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Interface Language</label>
                            <select id="interfaceLanguage" class="w-full p-2 border rounded-md">
                                <option value="en">English</option>
                                <option value="bem">Chibemba</option>
                                <option value="ny">Chichewa</option>
                                <option value="toi">Chitonga</option>
                                <option value="loz">Silozi</option>
                            </select>
                        </div>
                        
                        <div class="accessibility-option p-4 rounded-lg">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Voice Language</label>
                            <select id="voiceLanguage" class="w-full p-2 border rounded-md">
                                <option value="en-ZA">English (South Africa)</option>
                                <option value="bem-ZM">Chibemba (Zambia)</option>
                                <option value="ny-MW">Chichewa (Malawi)</option>
                                <option value="toi-ZM">Chitonga (Zambia)</option>
                                <option value="loz-ZM">Silozi (Zambia)</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Save Button -->
                <div class="flex justify-end">
                    <button id="saveSettings" class="px-6 py-2 bg-copper-red text-white rounded-md hover:bg-opacity-90 transition-colors">
                        Save Settings
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/accessibility.js"></script>
</body>
</html>
